unbind r
bind r source-file ~/.tmux.conf

set -g prefix C-x
unbind C-b
bind C-x send-prefix

set -g mouse on
set -sg escape-time 10
set -g history-limit 5000
set -g focus-events on
set -g detach-on-destroy off

unbind '"'
unbind %

bind '|' split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,wezterm:RGB,alacritty:RGB,screen-256color:RGB"
set -g set-clipboard on
set -g allow-passthrough on

set-option -g status-position top
set -g status-justify left
set -g status-interval 5

set -g pane-border-style "fg=#26233a"
set -g pane-active-border-style "fg=#c4a7e7"
set -g pane-border-lines single

set -g message-style "bg=#191724,fg=#e0def4"
set -g message-command-style "bg=#26233a,fg=#ebbcba"

# Plugins

set -g @plugin "tmux-plugins/tpm"
set -g @plugin "rose-pine/tmux"

set -g @rose_pine_variant "main"
set -g @rose_pine_date_time "%x %X"
set -g @rose_pine_user "on"
set -g @rose_pine_hostname "on"
set -g @rose_pine_directory "on"

run "~/.tmux/plugins/tpm/tpm"

